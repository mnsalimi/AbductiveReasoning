prompt_templates:
  medqa_template:
    step1: |
      You are a professional medical scientist and biologist.
      You're given a medical context and background. 
      You should create a DAG representing the relationships between the entities in the context and all of their related entities and elements outside the context.
      ِYou should think thoroughly and create an exhaustive DAG that includes every causal relationship that is related to the context (from the provided text or outside it. Doesn't matter). Don't even omit one. All possibilties (even low) should be included.
      
      For each node, you must specify if it's binary or categorical:
      - Binary nodes: can only have two states (present/absent, yes/no, positive/negative)
      - Categorical nodes: can have multiple specific categories/states (MUST have at least 2 categories, otherwise use binary)
      
      CRITICAL: When defining categorical nodes, think about ALL POSSIBLE VALUES the variable can take, not just the value mentioned in the context.
      
      EXAMPLES OF CORRECT NODE DEFINITIONS:
      ✓ CORRECT: Patient_Age_Group (categorical: pediatric, young_adult, middle_aged, elderly)
      ✗ WRONG: Patient_Age_Group (categorical: elderly) ← Only one category!
      
      ✓ CORRECT: Treatment_Type (categorical: chemotherapy, radiation, surgery, immunotherapy, combination)
      ✗ WRONG: Treatment_Type (categorical: chemotherapy) ← Only one category!
      
      ✓ CORRECT: Disease_Severity (categorical: mild, moderate, severe, critical)
      ✗ WRONG: Disease_Severity (categorical: moderate) ← Only one category!
      
      ✓ CORRECT: Smoking_Status (binary)  ← Only two states: smoker/non-smoker
      ✗ WRONG: Smoking_Status (categorical: smoker) ← Should be binary!
      
      ✓ CORRECT: Drug_Class (categorical: antibiotic, antiviral, antifungal, antiparasitic)
      ✗ WRONG: Drug_Class (categorical: antibiotic) ← Only one category!
      
      Your output DAG should be in the exact following format:

      <reasoning> your full reasoning comes here </reasoning>
      <dag>
      NODES: 
      node1: node1_name (binary)
      node2: node2_name (categorical: category1, category2, category3, ..., last_category_name)
      node3: node3_name (binary)
      node4: node4_name (categorical: category1, category2, category3, ..., last_category_name)
      ...
      node{last_node_number}: last_node_name (binary)
      EDGES: 
      edge1: node{i} -> node{j}
      edge2: node{x} -> node{y}
      edge3: node{z} -> node{w}
      ...
      edge{last_edge_number}: node{last_node_number} -> node{first_node_number}
      </dag>

      ** the order of tags and nodes and edges must be strictly followed. the headers for nodes and edges must be strictly followed.
      ** for binary nodes: use format "node_name (binary)"
      ** for categorical nodes: use format "node_name (categorical: cat1, cat2, cat3, ...)" - MUST have at least 2 categories listed
      ** IMPORTANT: if a node only has 1 or 2 possible states, use binary type instead of categorical
      ** REMEMBER: Define categories as ALL POSSIBLE VALUES, not just what's mentioned in the context
      ** you should only output the DAG in the exact format above. No other text, no other format.
      ** obviously, all of the nodes that are mentioned in edges should be included in the NODES section.

    step2: |
      You are a professional medical scientist and biologist.
      You previously created a Bayesian Network (BN) Schema representing causal relationships for a medical context. Now you need to refine and enhance this BN Schema by identifying and specifying any missing nodes or edges that should be added.

      You will be given:
      1. The original medical context and question
      2. The answer choices for the question
      3. The BN Schema from Step 1

      Your task is to:
      - Carefully analyze the existing BN Schema from Step 1
      - Consider the specific answer choices to understand what diagnostic/reasoning paths are relevant
      - Identify any missing nodes that are medically relevant to the context and answer choices
      - Identify any missing edges (causal relationships) that should exist
      - Output ONLY the new nodes and edges to ADD (do NOT repeat the existing schema)
      - Ensure your additions are medically sound and comprehensive
      - For new nodes, specify if they are binary or categorical with their categories (categorical nodes MUST have at least 2 categories, otherwise use binary)
      
      CRITICAL: When defining categorical nodes, think about ALL POSSIBLE VALUES the variable can take, not just the value mentioned in the context.
      
      EXAMPLES OF CORRECT NODE DEFINITIONS:
      ✓ CORRECT: Imaging_Result (categorical: normal, mild_abnormality, moderate_abnormality, severe_abnormality)
      ✗ WRONG: Imaging_Result (categorical: normal) ← Only one category!
      
      ✓ CORRECT: Blood_Pressure_Level (categorical: hypotensive, normal, prehypertensive, hypertensive)
      ✗ WRONG: Blood_Pressure_Level (categorical: hypertensive) ← Only one category!
      
      ✓ CORRECT: Diabetes_Present (binary)  ← Only two states: present/absent
      ✗ WRONG: Diabetes_Present (categorical: present) ← Should be binary!
      
      ✓ CORRECT: Cancer_Stage (categorical: stage_I, stage_II, stage_III, stage_IV)
      ✗ WRONG: Cancer_Stage (categorical: stage_III) ← Only one category!

      Your output should be in the exact following format:

      <analysis> your detailed analysis of what is missing from the original BN Schema and why these additions are necessary </analysis>
      <additions>
      NEW_NODES: 
      node{N+1}: new_node1_name (binary)
      node{N+2}: new_node2_name (categorical: category1, category2, category3, ..., last_category_name)
      ...
      node{last_new_node_number}: last_new_node_name (binary|categorical: category1, category2, category3, ..., last_category_name)
      NEW_EDGES: 
      edge{M+1}: node{i} -> node{j}
      edge{M+2}: node{x} -> node{y}
      ...
      edge{last_new_edge_number}: node{last_node_number} -> node{first_node_number}
      </additions>

      ** If there are NO new nodes to add, write "NEW_NODES: None" under the NEW_NODES section
      ** If there are NO new edges to add, write "NEW_EDGES: None" under the NEW_EDGES section
      ** N is the total number of nodes from Step 1, so your new nodes should start at node{N+1}
      ** M is the total number of edges from Step 1, so your new edges should start at edge{M+1}
      ** Node numbering in new edges can reference both existing nodes (node1 to nodeN) and new nodes (node{N+1} onwards)
      ** For binary nodes: use format "node_name (binary)"
      ** For categorical nodes: use format "node_name (categorical: cat1, cat2, cat3, ...)" - MUST have at least 2 categories listed
      ** IMPORTANT: if a node only has 1 or 2 possible states, use binary type instead of categorical
      ** REMEMBER: Define categories as ALL POSSIBLE VALUES, not just what's mentioned in the context
      ** The order of tags must be strictly followed: <analysis> then <additions> with NEW_NODES before NEW_EDGES
      ** Obviously, all nodes mentioned in new edges must either exist in Step 1 or be defined in NEW_NODES section

    step2dot5: |
      You are a professional medical scientist and biologist.
      You have a Bayesian Network (BN) Schema that represents medical causal relationships. Your task is to ensure that the answer choices/options for the medical question are properly represented in the DAG as EXACTLY ONE categorical node with categories being EXACTLY the answer options - no more, no less.

      You will be given:
      1. The medical context and question
      2. The answer choices/options (A, B, C, D)
      3. The current BN Schema from previous steps

      CRITICAL REQUIREMENTS:
      - The answer options MUST exist as EXACTLY ONE categorical node in the DAG
      - The categories of this node MUST be the FULL TEXT of each answer option, NOT letters like "A", "B", "C", "D"
      - For example, if option A is "Diabetes mellitus", use "Diabetes mellitus" as the category, NOT "A" or "option_A"
      - If options currently exist as separate nodes, combined with other concepts, or incorrectly formatted, you must fix this
      - Do NOT remove nodes that are relevant to the options but don't directly represent the options themselves
      - Do NOT modify unrelated nodes

      Your task is to:
      1. IDENTIFY which nodes (if any) currently represent or partially represent the answer options
      2. REMOVE those nodes that incorrectly represent the options (they will be replaced)
      3. ADD exactly one categorical node with categories being the FULL TEXT of each answer option
      4. ADD appropriate edges connecting this new node to relevant parts of the DAG

      EXAMPLES:
      
      Example 1 - Options scattered as separate nodes:
      Current: node5: Diabetes (binary), node6: Hypertension (binary), node7: Hyperthyroidism (binary)
      Given options: A. Diabetes mellitus, B. Hypertension, C. Hyperthyroidism, D. Cushing syndrome
      Problem: Options are separate binary nodes
      Solution: REMOVE node5, node6, node7; ADD Diagnosis (categorical: Diabetes mellitus, Hypertension, Hyperthyroidism, Cushing syndrome)
      
      Example 2 - Using shortened or incorrect category names:
      Current: node8: Diagnosis (categorical: A, B, C, D)
      Given options: A. Acute myocardial infarction, B. Pulmonary embolism, C. Aortic dissection, D. Pneumothorax
      Problem: Using letters instead of full text
      Solution: REMOVE node8; ADD Diagnosis (categorical: Acute myocardial infarction, Pulmonary embolism, Aortic dissection, Pneumothorax)
      
      Example 3 - Options already correctly represented:
      Current: node4: Diagnosis (categorical: Diabetes mellitus, Hypertension, Hyperthyroidism, Cushing syndrome)
      Given options: A. Diabetes mellitus, B. Hypertension, C. Hyperthyroidism, D. Cushing syndrome
      Problem: None - already correct! Categories match the full text of options.
      Solution: REMOVE nothing; ADD nothing (OPTIONS_NODE: None)

      Your output must be in the exact following format:

      <analysis> your detailed analysis of how the answer options are currently represented in the DAG and what needs to be changed </analysis>
      <modifications>
      NODES_TO_REMOVE: 
      node{i}
      node{j}
      ...
      OPTIONS_NODE:
      node{N+1}: node_name (categorical: full_text_of_option_A, full_text_of_option_B, full_text_of_option_C, full_text_of_option_D)
      NODES_TO_ADD:
      node{N+2}: other_node_name (binary|categorical: ...)
      ...
      EDGES_TO_REMOVE: 
      edge{k}: node{x} -> node{y}
      ...
      EDGES_TO_ADD: 
      edge{M+1}: node{a} -> node{b}
      ...
      </modifications>

      ** If there are NO nodes to remove, write "NODES_TO_REMOVE: None"
      ** The OPTIONS_NODE section is MANDATORY - it must contain the node representing answer options
      ** If options are already correct, write "OPTIONS_NODE: None" and skip modifications
      ** If there are NO additional nodes to add (besides OPTIONS_NODE), write "NODES_TO_ADD: None" or omit the section
      ** If there are NO edges to remove, write "EDGES_TO_REMOVE: None"
      ** If there are NO edges to add, write "EDGES_TO_ADD: None"
      ** When removing a node, also remove all edges connected to it (list them in EDGES_TO_REMOVE)
      ** New node numbering continues from the current maximum (after accounting for removals)
      ** New edge numbering continues from the current maximum (after accounting for removals)
      ** CRITICAL: Use the FULL TEXT of answer options as categories, NOT letters or abbreviations

    step4: |
      You are a professional expert in probability and statistics with deep knowledge in Bayesian networks and conditional probability distributions.
      
      You are given a Bayesian Network node and a SPECIFIC condition of its parent nodes. Your task is to provide the conditional probability distribution for this node given this specific parent condition.
      
      You will be provided with:
      1. The target node information (name, type, possible states/categories)
      2. Parent nodes information (if any)
      3. The SPECIFIC parent condition/states you need to analyze
      4. The original context that led to this Bayesian network
      
      For the given parent condition, you need to estimate the conditional probability of each state of the target node.
      
      IMPORTANT: You must express probabilities using ONLY these qualitative terms below:
      - "very_low"
      - "low"
      - "moderate" 
      - "high" 
      - "very_high" 
      
      Your output must be in the exact following format:
      
      <reasoning> your detailed reasoning about why this specific parent condition leads to these probability estimates for the target node </reasoning>
      <cpd_row>
      NODE: target_node_name
      CONDITION: specific_parent_condition
      STATES: state1, state2, state3, ...
      
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      </cpd_row>
      
      ** For root nodes with no parents, use: "CONDITION: NO_PARENTS"
      ** Use only the five specified qualitative terms: very_low, low, moderate, high, very_high
      ** Focus on this specific condition only - do not provide probabilities for other parent combinations

    step4_batch: |
      You are a professional expert in probability and statistics with deep knowledge in Bayesian networks and conditional probability distributions.
      
      You are given a Bayesian Network node and MULTIPLE CONDITIONS of its parent nodes. Your task is to provide the conditional probability distribution for this node given EACH of the parent conditions listed.
      
      You will be provided with:
      1. The target node information (name, type, possible states/categories)
      2. Parent nodes information (if any)
      3. MULTIPLE parent conditions/states you need to analyze
      4. The original context that led to this Bayesian network
      
      For EACH given parent condition, you need to estimate the conditional probability of each state of the target node.
      
      IMPORTANT: You must express probabilities using ONLY these qualitative terms below:
      - "very_low"
      - "low"
      - "moderate" 
      - "high" 
      - "very_high" 
      
      Your output must be in the exact following format:
      
      <reasoning> your detailed reasoning about why these specific parent conditions lead to these probability estimates for the target node </reasoning>
      <cpd_rows>
      ROW 1:
      CONDITION: first_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      
      ROW 2:
      CONDITION: second_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      
      ROW N:
      CONDITION: nth_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      </cpd_rows>
      
      ** For root nodes with no parents, use: "CONDITION: NO_PARENTS"
      ** Use only the five specified qualitative terms: very_low, low, moderate, high, very_high
      ** You MUST provide probability estimates for ALL conditions listed
      ** Each ROW should correspond to the conditions in the order they were listed

    step3dot5: |
      You are analyzing a medical question to identify which variables (nodes) in a Bayesian Network have known values from the question and context.
      
      You will be provided with:
      1. The medical question and context
      2. Answer choices (if available)
      3. A list of DAG nodes with their IDs, names, types, and possible values
      
      TASK:
      Carefully analyze the question and context above. For each node in the DAG, determine if its value is explicitly mentioned or can be directly inferred from the information provided. A node is "visible" if we know its exact value from the question/context.
      
      For example:
      - If the context mentions "65-year-old man", then an "age_category" node might be visible with value "elderly" or "old"
      - If it says "no history of smoking", then a "smoking_history" node is visible with value "no"
      - If symptoms are described, relevant symptom nodes are visible with value "yes"
      
      IMPORTANT:
      - Only identify nodes as visible if their value is CERTAIN from the context
      - Use the EXACT node IDs from the "AVAILABLE NODE IDs" list provided above
      - Use the EXACT values from the "possible values" list for each node
      - If a node's value is uncertain or not mentioned, do NOT include it
      - Match values to the node's type (binary: yes/no; categorical: one of the listed categories)
      
      CRITICAL FORMAT REQUIREMENTS:
      - Use the EXACT node ID format (e.g., "node2" not "2" or "Node 2")
      - Node IDs may have gaps (e.g., node2, node3, node5, node7) - this is normal
      - You MUST use only node IDs that appear in the "AVAILABLE NODE IDs" list
      
      Your output must be in the exact following format:
      
      <reasoning>
      [Explain your analysis of which nodes are visible and why, going through the context systematically]
      </reasoning>
      
      <visible_nodes>
      [For each visible node, list it in this format:]
      NODE: [exact node_id from the AVAILABLE NODE IDs list, e.g., node2]
      VALUE: [exact value from the node's possible values]
      
      [If no nodes are visible, write:]
      None
      </visible_nodes>

    step7: |
      You are given the results of a Bayesian Network analysis for a medical question. The analysis has determined the values of all variables (nodes) in the network through a combination of:
      1. Observed variables: directly mentioned in the question/context
      2. Inferred variables: determined through Most Probable Explanation (MPE) inference
      
      YOUR TASK:
      Based on the variable assignments shown below, identify what answer option the analysis indicates. DO NOT solve the medical problem yourself - simply identify what answer is indicated by the given analysis results.
      
      Your output must be in the exact following format:
      
      <answer>
      OPTION: [single letter: A, B, C, or D]
      VALUE: [the exact text of the chosen option]
      </answer>
      
      CRITICAL:
      - Output only the <answer> block, nothing else
      - OPTION must be a single uppercase letter (A, B, C, or D)
      - VALUE must be the complete text of that option
      - Do NOT add any reasoning or explanation outside the <answer> block

