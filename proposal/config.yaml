      1. IDENTIFY which nodes (if any) currently represent or partially represent the hypothesis conclusion
      2. REMOVE those nodes that incorrectly represent the conclusion (they will be replaced)
      3. ADD exactly one categorical node that correctly represents the hypothesis conclusion states
      4. ADD appropriate edges connecting this new node to relevant parts of the DAG

      EXAMPLES:
      
      Example 1 - Hypothesis scattered as separate binary nodes:
      Current: node5: Hypothesis_True (binary), node6: Evidence_Supports (binary)
      Problem: Conclusion represented by multiple separate nodes
      Solution: REMOVE node5, node6; ADD Hypothesis_Conclusion (categorical: strongly_supported, supported, neutral, contradicted, strongly_contradicted)
      
      Example 2 - Conclusion combined with other reasoning:
      Current: node8: Reasoning_and_Conclusion (categorical: valid_logic_supports_hypothesis, invalid_logic, uncertain)
      Problem: Conclusion mixed with reasoning process
      Solution: REMOVE node8; ADD Hypothesis_Conclusion (categorical: supported, not_supported, contradicted, uncertain)
      
      Example 3 - Conclusion already correctly represented:
      Current: node4: Hypothesis_Conclusion (categorical: supported, not_supported, contradicted, uncertain)
      Problem: None - already correct!
      Solution: REMOVE nothing; ADD nothing (OPTIONS_NODE: None)

      Your output must be in the exact following format:

      <analysis> your detailed analysis of how the hypothesis conclusion is currently represented in the DAG and what needs to be changed </analysis>
      <modifications>
      NODES_TO_REMOVE: 
      node{i}
      node{j}
      ...
      OPTIONS_NODE:
      node{N+1}: node_name (categorical: conclusion_state1, conclusion_state2, conclusion_state3, ...)
      NODES_TO_ADD:
      node{N+2}: other_node_name (binary|categorical: ...)
      ...
      EDGES_TO_REMOVE: 
      edge{k}: node{x} -> node{y}
      ...
      EDGES_TO_ADD: 
      edge{M+1}: node{a} -> node{b}
      ...
      </modifications>

      ** If there are NO nodes to remove, write "NODES_TO_REMOVE: None"
      ** The OPTIONS_NODE section is MANDATORY - it must contain the node representing hypothesis conclusion
      ** If conclusion is already correct, write "OPTIONS_NODE: None" and skip modifications
      ** If there are NO additional nodes to add (besides OPTIONS_NODE), write "NODES_TO_ADD: None" or omit the section
      ** If there are NO edges to remove, write "EDGES_TO_REMOVE: None"
      ** If there are NO edges to add, write "EDGES_TO_ADD: None"
      ** When removing a node, also remove all edges connected to it (list them in EDGES_TO_REMOVE)
      ** New node numbering continues from the current maximum (after accounting for removals)
      ** New edge numbering continues from the current maximum (after accounting for removals)
      ** The categorical node representing the conclusion should have meaningful logical states

    step4: |
      You are a professional expert in probability and statistics with deep knowledge in Bayesian networks and conditional probability distributions.
      
      You are given a Bayesian Network node and a SPECIFIC condition of its parent nodes. Your task is to provide the conditional probability distribution for this node given this specific parent condition based on logical reasoning principles.
      
      You will be provided with:
      1. The target node information (name, type, possible states/categories)
      2. Parent nodes information (if any)
      3. The SPECIFIC parent condition/states you need to analyze
      4. The original logical context that led to this Bayesian network
      
      For the given parent condition, you need to estimate the conditional probability of each state of the target node based on logical reasoning principles.
      
      IMPORTANT: You must express probabilities using ONLY these qualitative terms below:
      - "very_low" 
      - "low"
      - "moderate" 
      - "high" 
      - "very_high"
      
      Your output must be in the exact following format:
      
      <reasoning> your detailed reasoning about why this specific parent condition leads to these probability estimates for the target node based on logical principles </reasoning>
      <cpd_row>
      NODE: target_node_name
      CONDITION: specific_parent_condition
      STATES: state1, state2, state3, ...
      
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      </cpd_row>
      
      ** For root nodes with no parents, use: "CONDITION: NO_PARENTS"
      ** Use only the five specified qualitative terms: very_low, low, moderate, high, very_high
      ** Focus on this specific condition only - do not provide probabilities for other parent combinations

    step4_batch: |
      You are a professional expert in probability and statistics with deep knowledge in Bayesian networks and conditional probability distributions.
      
      You are given a Bayesian Network node and MULTIPLE CONDITIONS of its parent nodes. Your task is to provide the conditional probability distribution for this node given EACH of the parent conditions listed based on logical reasoning principles.
      
      You will be provided with:
      1. The target node information (name, type, possible states/categories)
      2. Parent nodes information (if any)
      3. MULTIPLE parent conditions/states you need to analyze
      4. The original logical context that led to this Bayesian network
      
      For EACH given parent condition, you need to estimate the conditional probability of each state of the target node based on logical reasoning principles.
      
      IMPORTANT: You must express probabilities using ONLY these qualitative terms below:
      - "very_low" 
      - "low"
      - "moderate" 
      - "high" 
      - "very_high"
      
      Your output must be in the exact following format:
      
      <reasoning> your detailed reasoning about why these specific parent conditions lead to these probability estimates for the target node based on logical principles </reasoning>
      <cpd_rows>
      ROW 1:
      CONDITION: first_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      
      ROW 2:
      CONDITION: second_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      
      ROW N:
      CONDITION: nth_parent_condition
      PROBABILITIES:
      target_state1: probability_level
      target_state2: probability_level
      target_state3: probability_level
      ...
      </cpd_rows>
      
      ** For root nodes with no parents, use: "CONDITION: NO_PARENTS"
      ** Use only the five specified qualitative terms: very_low, low, moderate, high, very_high
      ** You MUST provide probability estimates for ALL conditions listed
      ** Each ROW should correspond to the conditions in the order they were listed

    step3dot5: |
      You are analyzing a logical reasoning task to identify which variables (nodes) in a Bayesian Network have known values from the context and hypothesis.
      
      You will be provided with:
      1. The logical context and hypothesis
      2. A list of DAG nodes with their IDs, names, types, and possible values
      
      TASK:
      Carefully analyze the context and hypothesis above. For each node in the DAG, determine if its value is explicitly mentioned or can be directly inferred from the information provided. A node is "visible" if we know its exact value from the context/hypothesis.
      
      IMPORTANT:
      - Only identify nodes as visible if their value is CERTAIN from the context
      - Use the EXACT node IDs from the "AVAILABLE NODE IDs" list provided above
      - Use the EXACT values from the "possible values" list for each node
      - If a node's value is uncertain or not mentioned, do NOT include it
      - Match values to the node's type (binary: yes/no; categorical: one of the listed categories)
      
      CRITICAL FORMAT REQUIREMENTS:
      - Use the EXACT node ID format (e.g., "node2" not "2" or "Node 2")
      - Node IDs may have gaps (e.g., node2, node3, node5, node7) - this is normal
      - You MUST use only node IDs that appear in the "AVAILABLE NODE IDs" list
      
      Your output must be in the exact following format:
      
      <reasoning>
      [Explain your analysis of which nodes are visible and why, going through the context systematically]
      </reasoning>
      
      <visible_nodes>
      [For each visible node, list it in this format:]
      NODE: [exact node_id from the AVAILABLE NODE IDs list, e.g., node2]
      VALUE: [exact value from the node's possible values]
      
      [If no nodes are visible, write:]
      None
      </visible_nodes>

    step7: |
      You are given the results of a Bayesian Network analysis for a logical reasoning task. The analysis has determined the values of all variables (nodes) in the network through a combination of:
      1. Observed variables: directly mentioned in the context/hypothesis
      2. Inferred variables: determined through Most Probable Explanation (MPE) inference
      
      YOUR TASK:
      Based on the variable assignments shown below, identify what conclusion the analysis indicates about the hypothesis. DO NOT solve the logical problem yourself - simply identify what conclusion is indicated by the given analysis results.
      
      Your output must be in the exact following format:
      
      <answer>
      CONCLUSION: [the conclusion about the hypothesis - what sentences support it]
      </answer>
      
      CRITICAL:
      - Output only the <answer> block, nothing else
      - CONCLUSION should describe what the analysis determined
      - Do NOT add any reasoning or explanation outside the <answer> block

